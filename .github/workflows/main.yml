name: PDF Tools Workflow

# Déclenchement UNIQUEMENT manuel depuis l'interface GitHub
on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF utilities
        run: |          
          sudo apt-get install --yes pdftk poppler-utils
